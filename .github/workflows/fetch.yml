name: fetch-vm
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VM bundle
        run: |
          set -eux
          SHA=882518393ed4ce89020bd48d99d5daf114999773
          BASE="https://downloads.claude.ai/vms/linux/x64/${SHA}"
          mkdir -p out
          curl -fL --retry 5 --retry-all-errors -o out/rootfs.img.zst     "${BASE}/rootfs.img.zst"
          curl -fL --retry 5 --retry-all-errors -o out/vmlinuz.zst       "${BASE}/vmlinuz.zst"
          curl -fL --retry 5 --retry-all-errors -o out/initrd.zst        "${BASE}/initrd.zst"
          curl -fL --retry 5 --retry-all-errors -o out/initrd-micro.zst  "${BASE}/initrd-micro.zst"
          curl -fL --retry 5 --retry-all-errors -o out/linux-claude.zst  "https://downloads.claude.ai/claude-code-releases/2.1.299/linux-x64/claude.zst"
      - name: Verify sha256
        run: |
          cd out
          sha256sum -c <<'EOF'
          1c3e856d002d52df2246446ce0e3ae21fb65fdd81451f29a8e908305697a52c0  rootfs.img.zst
          3118616ef6ba3866652284b8b4c224a96876c56091724c35c93caf1ccb9b50a9  vmlinuz.zst
          c12df253f5ddac9f7f7cdf317c7257586d262eabd9336c1ce001301399fbe56a  initrd.zst
          e8a5fa87ae465403ae5e8261e64c952527eb411828759d421086e14f05858531  initrd-micro.zst
          EOF
          ls -lh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create vm-bundle --title "vm-bundle" --notes "auto-fetched" \
            out/rootfs.img.zst out/vmlinuz.zst out/initrd.zst out/initrd-micro.zst out/linux-claude.zst
